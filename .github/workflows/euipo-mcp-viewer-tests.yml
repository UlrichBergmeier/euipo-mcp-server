name: EUIPO MCP viewer tests
on:
  pull_request:
    paths:
      - 'server.py'
      - 'trademark_viewer.html'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'test_viewer.py'
      - 'test_extensions.py'
      - 'test_auth.py'
      - 'test_euipo.py'
      - 'test_similarity.py'
      - '.github/workflows/euipo-mcp-viewer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH0_ISSUER: https://dev-yf816x77jyish1bb.eu.auth0.com/
      MCP_RESOURCE_URL: https://mcp.trademark-assistant.de/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest -v test_auth test_euipo test_similarity test_extensions test_viewer
      - name: Check embedded viewer JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib
          import re
          html = pathlib.Path("trademark_viewer.html").read_text()
          match = re.search(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if match is None:
              raise RuntimeError("JavaScript block not found")
          pathlib.Path("/tmp/euipo_viewer.js").write_text(match.group(1))
          PY
          node --check /tmp/euipo_viewer.js
