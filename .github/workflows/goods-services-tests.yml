name: Goods and Services offline tests

on:
  push:
    branches:
      - feature/euipo-goods-services
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "httpx>=0.27,<1"
      - name: Syntax-check new modules
        run: python -m py_compile goods_services.py server.py test_goods_services.py
      - name: Run Goods and Services API contract tests
        run: python -m unittest -v test_goods_services.py
      - name: Run existing trademark query tests
        run: python -m unittest -v test_euipo.py test_similarity.py
