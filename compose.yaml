# LOCAL ONLY: no public port and no Traefik labels. Never expose without security testing.
name: euipo-mcp-local
services:
  euipo-mcp:
    build: .
    restart: unless-stopped
    environment:
      AUTH0_ISSUER: "https://dev-yf816x77jyish1bb.eu.auth0.com/"
      MCP_RESOURCE_URL: "https://mcp.trademark-assistant.de"
    networks:
      - default
      - traefik_shared
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - type: bind
        source: ./private/euipo_client_id
        target: /run/secrets/euipo_client_id
        read_only: true
      - type: bind
        source: ./private/euipo_client_secret
        target: /run/secrets/euipo_client_secret
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 512m

networks:
  default:
  traefik_shared:
    external: true
    name: root_default
