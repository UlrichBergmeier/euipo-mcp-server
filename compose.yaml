# LOCAL ONLY: no public port, no Traefik labels.
name: euipo-mcp-local
services:
  euipo-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - type: bind
        source: ./private/euipo_client_id
        target: /run/secrets/euipo_client_id
        read_only: true
      - type: bind
        source: ./private/euipo_client_secret
        target: /run/secrets/euipo_client_secret
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 512m
